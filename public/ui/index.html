<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Webhook Sender</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --border: #2a2f3e;
      --accent: #00c2ff; --accent2: #7b5ea7; --text: #e8eaf0;
      --muted: #6b7280; --success: #22d3a5; --error: #ff5c72; --radius: 6px;
    }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 24px; gap: 16px; }
    header { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    h1 { font-size: 15px; font-weight: 600; }
    h1 span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 600; }
    label em { font-style: normal; color: var(--muted); font-size: 11px; margin-left: 6px; }
    input, select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: monospace; font-size: 12px; padding: 9px 12px; outline: none; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 64px; }
    .row { display: grid; grid-template-columns: 100px 1fr; gap: 12px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { font-size: 11px; color: var(--muted); }
    hr { border: none; border-top: 1px solid var(--border); }
    footer { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border); }
    #status { font-size: 11px; font-family: monospace; flex: 1; color: var(--muted); }
    #status.ok { color: var(--success); }
    #status.err { color: var(--error); }
    .btn { padding: 9px 20px; border-radius: var(--radius); font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
    .ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  </style>
</head>
<body>

<header>
  <div class="icon">⚡</div>
  <h1>Webhook Sender <span>journey builder · custom activity</span></h1>
</header>

<div class="field">
  <label>Webhook URL <em>required</em></label>
  <div class="row">
    <select id="method"><option value="POST">POST</option><option value="PUT">PUT</option><option value="PATCH">PATCH</option></select>
    <input type="url" id="webhookUrl" placeholder="https://your-api.com/webhook" />
  </div>
  <p class="hint">Receives contact data when a contact enters this activity.</p>
</div>

<hr/>

<div class="field">
  <label>Authorization <em>optional</em></label>
  <div class="row2">
    <input type="text" id="authHeader" placeholder="Authorization" />
    <input type="text" id="authValue" placeholder="Bearer YOUR_TOKEN" />
  </div>
</div>

<hr/>

<div class="field">
  <label>Custom Payload <em>optional JSON</em></label>
  <textarea id="extraPayload" placeholder='{"source":"sfmc-journey"}'></textarea>
</div>

<footer>
  <span id="status"></span>
  <button class="btn ghost" id="btnCancel">Cancel</button>
  <button class="btn primary" id="btnSave">Save Activity</button>
</footer>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  var activity = {};

  // ── postMessage helpers ────────────────────────────────────────────────
  function jbPost(method, data) {
    var payload = { method: method };
    if (data !== undefined) payload.data = data;
    // Send both string and object — different JB versions expect different formats
    window.parent.postMessage(JSON.stringify(payload), '*');
    window.parent.postMessage(payload, '*');
  }

  // ── Fire ready IMMEDIATELY — before anything else ──────────────────────
  jbPost('ready');

  // ── Also fire ready after DOM is fully loaded ──────────────────────────
  document.addEventListener('DOMContentLoaded', function () {
    jbPost('ready');
  });

  // ── Listen for Journey Builder messages ───────────────────────────────
  window.addEventListener('message', function (evt) {
    var data = evt.data;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (!data || !data.method) return;

    switch (data.method) {
      case 'initActivity':
        onInit(data.data || data);
        break;
      case 'clickedNext':
      case 'save':
        doSave();
        break;
      case 'clickedBack':
      case 'cancel':
        doCancel();
        break;
    }
  });

  function onInit(payload) {
    if (!payload) return;
    activity = payload;
    var inArgs = {};
    var arr = (payload.arguments && payload.arguments.execute && payload.arguments.execute.inArguments) || [];
    arr.forEach(function (o) { Object.assign(inArgs, o); });
    document.getElementById('webhookUrl').value   = inArgs.webhookUrl   || '';
    document.getElementById('method').value       = inArgs.method       || 'POST';
    document.getElementById('authHeader').value   = inArgs.authHeader   || '';
    document.getElementById('authValue').value    = inArgs.authValue    || '';
    document.getElementById('extraPayload').value = inArgs.extraPayload || '';
  }

  function doSave() {
    var url       = document.getElementById('webhookUrl').value.trim();
    var method    = document.getElementById('method').value;
    var authHdr   = document.getElementById('authHeader').value.trim();
    var authVal   = document.getElementById('authValue').value.trim();
    var extraRaw  = document.getElementById('extraPayload').value.trim();

    if (!url) { setStatus('⚠ Webhook URL is required.', 'err'); return; }
    try { if (extraRaw) JSON.parse(extraRaw); }
    catch (e) { setStatus('⚠ Invalid JSON in custom payload.', 'err'); return; }

    activity.metaData = activity.metaData || {};
    activity.metaData.isConfigured = true;
    activity.arguments = activity.arguments || {};
    activity.arguments.execute = activity.arguments.execute || {};
    activity.arguments.execute.inArguments = [
      { contactKey:    '{{Contact.Key}}' },
      { emailAddress:  '{{InteractionDefaults.Email}}' },
      { firstName:     '{{Contact.Attribute.ExactTargetSubscriberContext_def.FirstName}}' },
      { lastName:      '{{Contact.Attribute.ExactTargetSubscriberContext_def.LastName}}' },
      { journeyName:   '{{Interaction.Name}}' },
      { activityName:  '{{Activity.Name}}' },
      { webhookUrl:    url },
      { method:        method },
      { authHeader:    authHdr },
      { authValue:     authVal },
      { extraPayload:  extraRaw }
    ];

    setStatus('✓ Saved!', 'ok');
    setTimeout(function () { jbPost('updateActivity', activity); }, 300);
  }

  function doCancel() {
    jbPost('cancelActivity');
  }

  function setStatus(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls;
  }

  document.getElementById('btnSave').addEventListener('click', doSave);
  document.getElementById('btnCancel').addEventListener('click', doCancel);
</script>
</body>
</html>
